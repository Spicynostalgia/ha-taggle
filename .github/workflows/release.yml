name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  packages: write
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install PyYAML==6.0.3
      - name: Validate release and extract changelog
        id: release
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python scripts/prepare_release.py "$TAG" --notes "$RUNNER_TEMP/release-notes.md"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish amd64 add-on
        uses: docker/build-push-action@v6
        with:
          context: ./addon
          file: ./addon/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.release.outputs.owner }}/ha-taggle-addon-amd64:${{ steps.release.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/amd64-base-debian:bookworm
            BUILD_ARCH=amd64
            BUILD_VERSION=${{ steps.release.outputs.version }}
      - name: Publish aarch64 add-on
        uses: docker/build-push-action@v6
        with:
          context: ./addon
          file: ./addon/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ steps.release.outputs.owner }}/ha-taggle-addon-aarch64:${{ steps.release.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/aarch64-base-debian:bookworm
            BUILD_ARCH=aarch64
            BUILD_VERSION=${{ steps.release.outputs.version }}
      - name: Publish standalone multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.release.outputs.owner }}/ha-taggle:${{ steps.release.outputs.version }}
            ghcr.io/${{ steps.release.outputs.owner }}/ha-taggle:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
