name: Taggle water meter
version: "0.3.0"
slug: taggle_rx
url: https://github.com/Spicynostalgia/ha-taggle
image: ghcr.io/spicynostalgia/ha-taggle-addon-{arch}
description: Receive your own Taggle water meter with RTL-SDR and MQTT
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
usb: true
services:
  - mqtt:need
options:
  meter_ids: []
  log_all_meters: false
  neighbourhood: true
  neighbourhood_min_meters: 3
  frequency: 922200000
  gain: 40
  device: "0"
  timezone: UTC
  litres_per_count: []
  meter_reading_offset: []
  dial_unit: m3
  calibration_max_uncertainty: 0.02
  calibration_min_litres: 200
  jsonl_logging: false
  scan_minutes: 0
  leak_detection: true
  leak_continuous_hours: 24
  leak_night_start: "01:00"
  leak_night_end: "05:00"
  leak_night_min_pulses: 1
schema:
  meter_ids:
    - "int(0,1048575)"
  log_all_meters: bool
  neighbourhood: bool
  neighbourhood_min_meters: "int(3,)"
  neighbourhood_litres_per_count: "float(0.000001,1000000)?"
  frequency: "int(921700000,922490000)"
  gain: "float(0,50)"
  device: str
  timezone: str
  litres_per_count:
    - meter_id: "int(0,1048575)"
      value: "float(0.000001,1000000)"
  meter_reading_offset:
    - meter_id: "int(0,1048575)"
      value: float
  dial_unit: "list(m3|kl|L)"
  calibration_max_uncertainty: "float(0.000001,1)"
  calibration_min_litres: "float(0.000001,1000000000)"
  jsonl_logging: bool
  scan_minutes: "int(0,1440)"
  leak_detection: bool
  leak_continuous_hours: "int(1,168)"
  leak_night_start: "match(^(?:[01][0-9]|2[0-3]):[0-5][0-9]$)"
  leak_night_end: "match(^(?:[01][0-9]|2[0-3]):[0-5][0-9]$)"
  leak_night_min_pulses: "int(1,65535)"
