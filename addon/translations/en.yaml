configuration:
  meter_ids:
    name: Meter IDs
    description: Decimal transmitter IDs you own. Required unless scanning or explicitly logging all meters.
  log_all_meters:
    name: Accept all meter IDs
    description: Allow logging other heard IDs. Leave disabled for normal use.
  neighbourhood:
    name: Anonymous neighbourhood comparison
    description: Compare with other heard meters. Disabling deletes anonymous neighbour state and its private salt on startup.
  neighbourhood_min_meters:
    name: Minimum neighbours
    description: Privacy floor for each aggregate cohort. At least three, even if a lower value is supplied.
  neighbourhood_litres_per_count:
    name: Neighbourhood litres per count
    description: Optional assumed pulse value for neighbours. If omitted, use the first configured meter's calibration, or raw pulses. Same council/model often shares a pulse value, but this is unverified.
  frequency:
    name: Centre frequency (Hz)
    description: Default 922200000. The supported channel must remain inside the sampled band.
  gain:
    name: SDR gain (dB)
  device:
    name: RTL-SDR index or serial
  timezone:
    name: Local timezone
    description: An IANA timezone for daily totals, photo reading times and transmission guidance, for example Australia/Brisbane. Also set Home Assistant to this timezone.
  litres_per_count:
    name: Litres per count
    description: Optional manual pins (meter_id and value). Leave empty for guided calibration from two dial readings in Home Assistant.
  meter_reading_offset:
    name: Meter reading offset
    description: Optional offset pins in litres (meter_id and value). Requires a pinned litres-per-count factor; normally leave empty.
  dial_unit:
    name: Default dial unit
    description: Default m3 (m³), kl (kL) or L. Match the dial; 1 m³ = 1 kL = 1000 L. Each meter's saved Dial unit selector takes precedence.
  calibration_max_uncertainty:
    name: Maximum calibration uncertainty
    description: Maximum full relative bounds width for a nonstandard pulse fit. Default 0.02 (2%). A unique standard pulse size applies automatically.
  calibration_min_litres:
    name: Minimum calibration usage (L)
    description: Default 200 L between readings, or at least 40 pulses. Use water normally and take another reading about a day later.
  jsonl_logging:
    name: Write daily JSONL logs
    description: Store filtered decoded readings in persistent app data. Logs need manual retention management.
  scan_minutes:
    name: Scan duration (minutes)
    description: Set above zero to print heard IDs and SNR without MQTT or disk writes. Set back to zero for normal operation.
