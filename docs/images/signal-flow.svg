      <rect x="478" y="150" width="44" height="39" rx="6" fill="#fff"/>
      <rect x="489" y="163" width="24" height="12" rx="2"/>
      <path d="M513 167H517V171H513M493 166V172M499 169H507M500 150V141M508 143Q517 146 517 153"/>
      <path d="M764 146V184M747 188H781M764 153L749 168M764 153L779 168"/>
