<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1436" viewBox="0 0 1200 1436" role="img" aria-labelledby="title desc">
  <title id="title">How a reading travels: equipment → bitstream → application</title>
  <desc id="desc">Three lanes trace the tested Gladstone, Queensland cable-connected Taggle path. A mechanical meter feeds a pulse or Hall sensor and battery transmitter, which sends hourly BPSK DSSS bursts near 922 MHz to an antenna, RTL-SDR Blog V4 and host. At approximately 1172.66 symbols per second, 392, 440 and 488 symbols take 0.334, 0.375 and 0.416 seconds. The coding ladder unwraps 4095-chip PN symbols into a 104-symbol preamble and 288 coded bits, then an 18-byte, 144-bit clear frame. Its fields are sync bits 0–7, example transmitter ID 123456 or 0x1E240 in bits 8–27, header CRC bits 28–35, body bits 36–127, frame CRC bits 128–135 and zero tail bits 136–143. The expanded body covers hex nibbles 9–31: format, unknown fields, hourly sequence, separate flags and three 16-bit counters. The software lane shows rtl_sdr, receiver.py acquisition, dsss.py recovery, coding.py exact inversion or Viterbi, protocol.py validation and parsing, store.py routing into two paths: configured meter IDs enter usage checkpoints, while other meters enter anonymous neighbourhood tracking by HMAC-SHA256 of the decimal ID with a per-install salt, truncated to 16 hex characters. Local per-neighbour deltas feed aggregate average and median today, average last hour, and meters heard and counted, each subject to a minimum three-meter cohort. Only aggregates reach the MQTT Taggle neighbourhood device; no neighbour IDs or tracking keys are published. Configured meter state also reaches MQTT discovery, Home Assistant sensors, taggle-card and Energy, which requires calibration to litres. Neighbourhood tracking is on by default and can be disabled; scan and explicit log-all modes differ.</desc>
