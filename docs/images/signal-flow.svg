      <rect x="164" y="933" width="184" height="220" rx="9" fill="#fff"/>
      <rect x="388" y="933" width="300" height="160" rx="9" fill="#e3eef2"/>
      <rect x="388" y="1121" width="300" height="240" rx="9" fill="#e3eef2"/>
      <rect x="732" y="933" width="416" height="160" rx="9" fill="#e3eef2"/>
      <rect x="732" y="1121" width="200" height="240" rx="9" fill="#fff"/>
