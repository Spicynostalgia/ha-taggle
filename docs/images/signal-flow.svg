    </g>
    <g text-anchor="middle">
      <g font-size="16" font-weight="700">
        <text x="256" y="809">rtl_sdr</text><text x="456" y="809">receiver.py</text><text x="656" y="809">dsss.py</text>
        <text x="856" y="809">coding.py</text><text x="1056" y="809">protocol.py</text>
        <text x="256" y="960">store.py · route</text><text x="538" y="960">store.py · state</text>
        <text x="538" y="1148">neighbourhood (anonymous)</text><text x="940" y="960">mqtt.py · via MQTT broker</text>
        <text x="832" y="1148">Home Assistant</text><text x="1048" y="1148">taggle-card</text>
      </g>
      <g font-size="13">
        <text x="256" y="834">IQ stream</text><text x="256" y="853">cu8 over stdout</text><text x="256" y="872" fill="#526975">Launched by cli.py</text>
        <text x="456" y="834">Carrier screen</text><text x="456" y="853">PN correlation screen</text><text x="456" y="872">Coordinates decoding</text>
        <text x="656" y="834">Timing + clock recovery</text><text x="656" y="853">Costas loop</text><text x="656" y="872">Despread → symbols</text>
        <text x="856" y="834">Exact inverse first</text><text x="856" y="853">Viterbi fallback</text><text x="856" y="872">≤12 bit corrections*</text>
        <text x="1056" y="834">Sync + zero tail</text><text x="1056" y="853">Header CRC + frame CRC</text><text x="1056" y="872">ID, sequence, counters</text>
        <text x="256" y="993" font-weight="700">Configured meter_ids</text>
        <text x="256" y="1036">→ own usage state</text>
        <text x="256" y="1083" font-weight="700">Other meters</text>
        <text x="256" y="1106">↓ neighbourhood</text>
        <text x="256" y="1132" fill="#526975">On by default; optional</text>
        <text x="538" y="987">state.json · deduplicate intervals</text>
        <text x="538" y="1010">16-bit wraps → hourly deltas</text>
        <text x="538" y="1033">Today by local interval-end date</text>
        <text x="538" y="1056">Cumulative counts / calibrated litres</text>
        <text x="538" y="1175">HMAC(per-install salt, decimal ID)</text>
        <text x="538" y="1198">SHA-256 → 16-hex tracking key</text>
        <text x="538" y="1221">Local per-neighbour hourly deltas</text>
        <text x="538" y="1244" font-weight="700">Aggregates only → MQTT</text>
        <text x="538" y="1267">Average + median today; avg last hour</text>
        <text x="538" y="1290">Meters heard / counted · ≥3 per cohort</text>
        <text x="538" y="1313">Today: ≥6 intervals + ≥75% coverage</text>
        <text x="538" y="1336" fill="#526975">Encrypted: heard only · no own meters</text>
        <text x="940" y="987">Retained HA discovery + state</text>
        <text x="940" y="1010">Own meters: taggle/&lt;id&gt;/state</text>
        <text x="940" y="1033">“Taggle neighbourhood”: taggle/neighbourhood/state</text>
        <text x="940" y="1056">No neighbour IDs, tracking keys or individual readings</text>
        <text x="832" y="1175">Own usage + diagnostics</text>
        <text x="832" y="1198">last_hour · today</text>
        <text x="832" y="1221">meter_count · last_seen</text>
        <text x="832" y="1244">snr · signal_level</text>
        <text x="832" y="1267">Litres when calibrated</text>
        <text x="832" y="1290">Neighbourhood aggregates</text>
        <text x="832" y="1313">+ vs_neighbourhood_today</text>
        <text x="1048" y="1175">Usage + history</text>
        <text x="1048" y="1198">Neighbourhood comparison</text>
        <text x="1048" y="1244" font-size="16" font-weight="700">Energy dashboard</text>
        <text x="1048" y="1271">Calibrated total_litres</text>
        <text x="1048" y="1294" fill="#526975">Required for Energy</text>
      </g>
    </g>
    <text x="164" y="1392" font-size="13" fill="#526975">*protocol.py enforces the coded-bit correction limit. Normal receive mode shown; neighbourhood off → other meters discarded.</text>
    <text x="164" y="1415" font-size="13" fill="#526975">Scan prints heard IDs without state / MQTT. Explicit log-all + JSONL logging can record other IDs. MQTT topic prefixes are configurable.</text>
  </g>
</svg>
