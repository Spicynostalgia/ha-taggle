      <rect x="432" y="128" width="140" height="154" rx="9" fill="#d7e7df"/>
      <rect x="708" y="128" width="112" height="154" rx="9" fill="#fff"/>
      <rect x="838" y="128" width="178" height="154" rx="9" fill="#dce6e9"/>
      <rect x="1034" y="128" width="138" height="154" rx="9" fill="#e3eef2"/>
    </g>
    <g stroke="#425e6c" stroke-width="2.5" stroke-linejoin="round" fill="none">
      <path d="M183 166L191 153H231L239 166V186H183ZM183 166H239" fill="#d7e7df"/>
      <rect x="194" y="170" width="34" height="10" rx="2" fill="#fff"/>
      <path d="M201 171V178M209 171V178M217 171V178" stroke-width="1.5"/>
      <rect x="325" y="151" width="27" height="35" rx="5" fill="#dce6e9"/>
      <path d="M352 168H366Q376 168 376 180V187"/>
