    </g>
    <text x="164" y="314" font-size="13" fill="#526975">At ~1172.66 sym/s: 18 bytes / 392 symbols ≈ 0.334 s · 21 bytes / 440 ≈ 0.375 s · 24 bytes / 488 ≈ 0.416 s</text>

    <!-- 2. Coding layers, then a bit-proportional decoded frame. -->
    <g font-size="17" font-weight="700">
      <text x="28" y="372" fill="#167b9c">2</text>
      <text x="28" y="397">Bitstream</text>
    </g>
    <rect x="164" y="354" width="1008" height="41" rx="8" fill="#e3eef2" stroke="#425e6c" stroke-width="1.5"/>
    <text x="180" y="380" font-size="15"><tspan font-weight="700">RF chips</tspan><tspan> · 4095-chip PN m-sequence per symbol · poly 0x1267 · ~4.802 Mchip/s</tspan></text>
    <path d="M182 395V420" fill="none" stroke="#167b9c" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="198" y="413" font-size="13" fill="#167b9c">despread</text>
    <rect x="164" y="422" width="1008" height="43" rx="8" fill="#fff" stroke="#425e6c" stroke-width="1.5"/>
    <text x="180" y="449" font-size="15"><tspan font-weight="700">Coded symbols</tspan><tspan> · 104-symbol preamble + 288 coded bits · rate 1/2, K=7 · polys 0x6d / 0x4f</tspan></text>
    <path d="M182 465V493" fill="none" stroke="#167b9c" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="198" y="485" font-size="13" fill="#167b9c">Viterbi decode (exact inversion tried first)</text>
    <text x="164" y="512" font-size="14"><tspan font-weight="700">Decoded frame · 18 bytes = 144 bits</tspan><tspan fill="#526975"> · bit indices are zero-based, MSB-first</tspan></text>

    <!-- Roughly bit-proportional; short fields get room for legible labels.
         8 + 20 + 8 + 92 + 8 + 8 = 144 bits. -->
    <g stroke="#425e6c" stroke-width="1.5">
      <rect x="164" y="526" width="1008" height="44" rx="6" fill="#fff"/>
      <path d="M228 526H368V570H228Z" fill="#e3eef2"/>
      <path d="M432 526H1028V570H432Z" fill="#b5e1ef"/>
      <path d="M1100 526V570"/>
    </g>
    <g text-anchor="middle" font-size="13">
      <text x="196" y="543">Sync</text><text x="196" y="560">0xC0</text>
      <text x="298" y="543" font-weight="700">ID · 20 bits</text><text x="298" y="560">123456 / 0x1E240</text>
      <text x="400" y="543">Header</text><text x="400" y="560">CRC-8</text>
      <text x="730" y="553" font-size="15" font-weight="700">Body · 92 bits · hex nibbles 9–31</text>
      <text x="1064" y="543">Frame</text><text x="1064" y="560">CRC-8</text>
      <text x="1136" y="543">Tail</text><text x="1136" y="560">0x00</text>
      <g fill="#526975">
        <text x="196" y="590">0–7</text><text x="298" y="590">8–27</text><text x="400" y="590">28–35</text>
        <text x="730" y="590">36–127</text><text x="1064" y="590">128–135</text><text x="1136" y="590">136–143</text>
      </g>
    </g>

    <!-- Body expansion: 23 nibbles; extra label room for the format nibble. -->
    <path d="M432 596V604H164V634M1028 596V604H1172V634" fill="none" stroke="#425e6c" stroke-width="1"/>
    <text x="178" y="623" font-size="13" font-weight="700">Clear body expanded · hex nibble indices (nibble 9 = bits 36–39)</text>
    <g stroke="#425e6c" stroke-width="1">
      <rect x="164" y="634" width="1008" height="47" rx="5" fill="#fff"/>
      <path d="M263.826 634H351.478V681H263.826Z" fill="#e3eef2"/>
      <path d="M558.435 634H733.739V681H558.435Z M777.565 634H952.870V681H777.565Z M996.696 634H1172V676Q1172 681 1167 681H996.696Z" fill="#b5e1ef"/>
      <path d="M220 634V681M514.609 634V681M733.739 634V681M952.870 634V681"/>
    </g>
    <g text-anchor="middle" font-size="13">
      <g fill="#526975">
        <text x="192" y="651">9</text><text x="241.913" y="651">10</text><text x="307.652" y="651">11–12</text>
        <text x="433.043" y="651">13–16</text><text x="536.522" y="651">17</text><text x="646.087" y="651">18–21</text>
        <text x="755.652" y="651">22</text><text x="865.217" y="651">23–26</text><text x="974.783" y="651">27</text><text x="1084.348" y="651">28–31</text>
      </g>
      <text x="192" y="671">Format</text><text x="241.913" y="671">?</text><text x="307.652" y="671">Sequence</text>
      <text x="433.043" y="671">Unknown</text><text x="536.522" y="671">Flags</text><text x="646.087" y="671">Counter · newest</text>
      <text x="755.652" y="671">Flags</text><text x="865.217" y="671">Counter · −1 h</text><text x="974.783" y="671">Flags</text><text x="1084.348" y="671">Counter · −2 h</text>
    </g>
    <text x="164" y="704" font-size="13" fill="#526975">? = unknown · sequence: 8-bit hourly · format + flags: uninterpreted · counters: 16-bit each; three recover two hourly deltas</text>
    <text x="164" y="730" font-size="13" fill="#526975">CRC poly 0x07 (CRC-8/SMBUS params). 24-byte frames: body encrypted → ID + signal only.</text>

    <!-- 3. Normal receive path: receiver.py orchestrates the decoder calls. -->
    <g font-size="17" font-weight="700">
      <text x="28" y="803" fill="#167b9c">3</text>
      <text x="28" y="828">Application</text>
    </g>
    <text x="164" y="773" font-size="13" fill="#526975">Software on the host · configured meters and anonymous aggregates</text>
    <g fill="none" stroke="#167b9c" stroke-width="2" marker-end="url(#arrow)">
      <path d="M348 838H364"/><path d="M548 838H564"/>
      <path d="M748 838H764"/><path d="M948 838H964"/>
