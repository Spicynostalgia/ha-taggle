    <g text-anchor="middle">
      <g font-size="14" font-weight="700">
        <text x="209" y="211">Mechanical</text><text x="209" y="230">meter</text>
        <text x="352" y="211">Pulse / Hall</text><text x="352" y="230" font-size="13">sensor + cable</text>
        <text x="502" y="211">Taggle</text><text x="502" y="230">transmitter</text>
        <text x="764" y="211">Antenna</text>
        <text x="927" y="211">RTL-SDR Blog V4</text>
        <text x="1103" y="211">Host</text>
      </g>
      <g font-size="13" fill="#526975">
        <text x="209" y="249">V100-style</text><text x="209" y="268">register</text>
        <text x="352" y="255">Wired pulses</text>
        <text x="502" y="255">Battery · hourly</text>
        <text x="764" y="236">915–928 MHz</text>
        <text x="927" y="232">922.2 MHz centre</text>
        <text x="927" y="251">2.4 MS/s</text>
        <text x="927" y="270">cu8 IQ over USB</text>
        <text x="1103" y="236">HA add-on</text><text x="1103" y="255">/ Docker</text>
      </g>
      <g font-size="13" fill="#167b9c">
        <text x="640" y="151" font-weight="700">922 MHz RF</text>
        <text x="640" y="170">BPSK DSSS</text>
        <text x="640" y="188">~922.0 MHz</text>
        <text x="640" y="238">~1 burst/hour</text>
        <text x="640" y="257">392 symbols</text>
        <text x="640" y="276">≈ 0.334 s</text>
