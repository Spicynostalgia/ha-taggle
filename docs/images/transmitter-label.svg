<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Illustration of a transmitter label with fictional ID 123456 circled</title>
  <desc id="desc">A plain text Taggle label shows ID: 123456. A separate fictional serial and barcode are marked not this one. This is an illustration, not an actual product label or logo.</desc>
  <rect width="960" height="360" rx="16" fill="#f7fafb"/>
  <g font-family="Arial, sans-serif" fill="#203744">
    <text x="32" y="42" font-size="23" font-weight="700">Find the transmitter ID</text>
    <text x="32" y="68" font-size="15" fill="#526975">Illustration · simplified label, no real logo or identifiers</text>
    <rect x="40" y="92" width="450" height="234" rx="26" fill="#dce6e9" stroke="#425e6c" stroke-width="3"/>
    <rect x="68" y="113" width="394" height="191" rx="7" fill="#fff" stroke="#bac9ce" stroke-width="2"/>
    <text x="91" y="145" font-size="22">Taggle</text>
    <text x="91" y="193" font-size="29" font-family="monospace" font-weight="700">ID: 123456</text>
    <ellipse cx="194" cy="183" rx="122" ry="30" fill="none" stroke="#167b9c" stroke-width="3"/>
    <g stroke="#203744">
      <path d="M93 226V264M101 226V264M116 226V264M126 226V264M140 226V264M159 226V264M171 226V264M188 226V264M198 226V264M214 226V264M227 226V264M244 226V264M258 226V264M270 226V264M288 226V264M306 226V264M320 226V264M337 226V264M348 226V264M364 226V264M382 226V264M397 226V264M420 226V264" stroke-width="3"/>
      <path d="M109 226V264M148 226V264M181 226V264M237 226V264M280 226V264M331 226V264M373 226V264M409 226V264" stroke-width="6"/>
    </g>
    <text x="93" y="286" font-size="14" font-family="monospace">SERIAL: 654321</text>
    <path d="M319 183H525" fill="none" stroke="#167b9c" stroke-width="2.5"/>
    <text x="545" y="174" font-size="22" font-weight="700" fill="#167b9c">Use this: ID 123456</text>
    <text x="545" y="202" font-size="17">Decimal transmitter ID (often ~6 digits).</text>
    <path d="M426 259H525" fill="none" stroke="#9a6045" stroke-width="2.5"/>
    <text x="545" y="255" font-size="22" font-weight="700" fill="#9a6045">not this one</text>
    <text x="545" y="283" font-size="17">The separate barcode / serial line.</text>
    <text x="545" y="327" font-size="15" fill="#526975">Take a phone photo; leave the device in place.</text>
  </g>
</svg>
